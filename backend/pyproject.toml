[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "entangleops"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3", "numpy>=2.4.6", "scipy>=1.11", "networkx>=3.2", "scikit-learn>=1.4", "joblib>=1.3", "websockets>=12.0", "prometheus-client>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
ignore = ["E701", "E702", "E402"]
