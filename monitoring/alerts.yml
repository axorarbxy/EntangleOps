groups:
  - name: entangleops-availability
    rules:
      - alert: EntangleOpsDown
        expr: up{job="entangleops"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "EntangleOps scrape is down", description: "Prometheus cannot scrape the backend metrics endpoint."}
      - alert: EntangleOpsHighErrorRate
        expr: sum(rate(eo_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(eo_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Backend error rate is elevated", description: "More than 5% of requests returned server errors."}
      - alert: EntangleOpsSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(eo_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Backend requests are slow", description: "The five minute p95 request latency is above two seconds."}
      - alert: EntangleOpsQueueSaturated
        expr: eo_queue_depth >= eo_queue_capacity
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Run queue is saturated", description: "Queued simulation work has reached its configured capacity."}
      - alert: EntangleOpsAuditChainBroken
        expr: eo_audit_chain_ok == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Audit chain verification failed", description: "The audit log hash chain did not verify."}
      - alert: EntangleOpsPredictorDrift
        expr: eo_predictor_mae > 0.03
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Predictor error is elevated", description: "0.03 is a placeholder until a baseline is measured."}
      - alert: EntangleOpsPredictorOutOfRange
        expr: eo_predictor_out_of_range_ratio > 0.2
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Predictor inputs are outside training range", description: "0.2 is a placeholder until a baseline is measured."}
      - alert: EntangleOpsMLFeatureDrift
        expr: max(eo_ml_feature_psi) > 0.25
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "ML input feature drift is elevated", description: "PSI > 0.25 is a provisional trigger; measure and review against your workload before relying on it."}
      - alert: EntangleOpsMLIntervalCoverageLow
        expr: eo_ml_interval_coverage{alpha="0.05"} < 0.90 or eo_ml_interval_coverage{alpha="0.1"} < 0.85 or eo_ml_interval_coverage{alpha="0.2"} < 0.75
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "ML interval coverage is below nominal", description: "Coverage gauge is a shadow simulation measure; verify ground truth and alpha before taking action."}
      - alert: EntangleOpsMLInferenceSlow
        expr: histogram_quantile(0.95, sum by (le, kind) (rate(eo_ml_inference_seconds_bucket[5m]))) > 0.25
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "ML inference latency is elevated", description: "0.25 seconds is a provisional threshold; compare with the measured service baseline."}
      - alert: EntangleOpsDatabaseUnavailable
        expr: eo_db_reachable == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Database is unavailable", description: "The backend cannot reach its persistent database."}
      - alert: EntangleOpsDatabaseSchemaOutdated
        expr: eo_db_schema_current == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Database migrations are pending", description: "The live schema does not match the current Alembic head."}
      - alert: EntangleOpsDatabaseErrors
        expr: sum(rate(eo_db_errors_total[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Database operations are failing", description: "Database operation errors exceed the normal baseline."}
      - alert: EntangleOpsDatabaseSlowQueries
        expr: histogram_quantile(0.95, sum by (le) (rate(eo_db_operation_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Database operations are slow", description: "The five minute p95 database operation latency is above 500 ms."}
