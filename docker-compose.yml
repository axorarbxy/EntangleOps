services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      EO_ENV: production
      EO_TRUSTED_PROXY_COUNT: 1
      EO_BEHIND_TLS: "true"
    expose: ["8000"]
    volumes: ["./backend/data:/app/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
  proxy:
    image: caddy:2
    ports: ["443:443", "80:80"]
    volumes: ["./backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [backend]
    environment:
      EO_DOMAIN: ${EO_DOMAIN:-localhost}
    restart: unless-stopped
volumes:
  caddy_data:
